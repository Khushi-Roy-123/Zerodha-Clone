services:
  # Backend Service
  - type: web
    name: zerodha-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URL
        fromGroup: shared-credentials
      - key: FRONTEND_URL
        fromService:
          type: web
          name: zerodha-frontend
          property: url
      - key: DASHBOARD_URL
        fromService:
          type: web
          name: zerodha-dashboard
          property: url

  # Frontend Service
  - type: static
    name: zerodha-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: zerodha-backend
          property: url
      - key: REACT_APP_DASHBOARD_URL
        fromService:
          type: web
          name: zerodha-dashboard
          property: url

  # Dashboard Service
  - type: static
    name: zerodha-dashboard
    env: static
    plan: free
    buildCommand: cd dashboard && npm install && npm run build
    publishDir: dashboard/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: zerodha-backend
          property: url
      - key: REACT_APP_FRONTEND_URL
        fromService:
          type: web
          name: zerodha-frontend
          property: url
